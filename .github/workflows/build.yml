name: Build & Package DMG

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

env:
  APP_NAME: MouseActivitySimulator
  SCHEME:   MouseActivitySimulator
  VERSION:  ${{ github.event.inputs.version || '1.0.0' }}

jobs:
  build-dmg:
    name: Build DMG (target macOS 10.15+)
    runs-on: macos-14

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode 16
      run: |
        XCODE=$(ls /Applications/ | grep "^Xcode_16" | sort -V | tail -1)
        if [ -n "$XCODE" ]; then
          sudo xcode-select -s "/Applications/$XCODE"
        fi
        echo "=== Xcode version ==="
        xcodebuild -version
        echo "=== Available SDKs ==="
        xcodebuild -showsdks | grep macosx

    - name: Build Archive
      run: |
        set -o pipefail
        xcodebuild archive \
          -project       "$APP_NAME.xcodeproj" \
          -scheme        "$SCHEME" \
          -configuration Release \
          -destination   "generic/platform=macOS" \
          -archivePath   "$RUNNER_TEMP/$APP_NAME.xcarchive" \
          MACOSX_DEPLOYMENT_TARGET=10.15 \
          ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=YES \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM="" \
          2>&1 | tee "$RUNNER_TEMP/build.log" | \
          grep -E "^(error:|warning:|Build succeeded|FAILED|Compiling|Linking)" || true

        if [ ! -d "$RUNNER_TEMP/$APP_NAME.xcarchive" ]; then
          echo "=== BUILD FAILED — last 100 lines of log ==="
          tail -100 "$RUNNER_TEMP/build.log"
          exit 1
        fi
        echo "Archive OK: $RUNNER_TEMP/$APP_NAME.xcarchive"

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ${{ runner.temp }}/build.log

    - name: Extract .app from archive
      run: |
        APP_IN_ARCHIVE=$(find "$RUNNER_TEMP/$APP_NAME.xcarchive/Products" \
                              -name "*.app" -maxdepth 4 | head -1)
        if [ -z "$APP_IN_ARCHIVE" ]; then
          echo "ERROR: .app not found in archive"
          ls -R "$RUNNER_TEMP/$APP_NAME.xcarchive/Products"
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/export"
        cp -R "$APP_IN_ARCHIVE" "$RUNNER_TEMP/export/$APP_NAME.app"
        echo "App: $RUNNER_TEMP/export/$APP_NAME.app"
        du -sh "$RUNNER_TEMP/export/$APP_NAME.app"

    - name: Create DMG
      run: |
        STAGING="$RUNNER_TEMP/dmg_staging"
        DMG_VOLUME="$APP_NAME $VERSION"
        DMG_FILE="$APP_NAME-$VERSION.dmg"

        mkdir -p "$STAGING"
        cp -R "$RUNNER_TEMP/export/$APP_NAME.app" "$STAGING/"
        ln -sf /Applications "$STAGING/Applications"

        hdiutil create \
          -volname   "$DMG_VOLUME" \
          -srcfolder "$STAGING" \
          -ov \
          -format    UDZO \
          -imagekey  zlib-level=9 \
          "$DMG_FILE"

        hdiutil verify "$DMG_FILE"
        echo "DMG_FILE=$DMG_FILE" >> "$GITHUB_ENV"
        du -sh "$DMG_FILE"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-${{ env.VERSION }}-macOS
        path: ${{ env.APP_NAME }}-${{ env.VERSION }}.dmg
        retention-days: 30

    - name: Create GitHub Release on tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Mouse Activity Simulator ${{ env.VERSION }}
        generate_release_notes: true
        files: ${{ env.APP_NAME }}-${{ env.VERSION }}.dmg
