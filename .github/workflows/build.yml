name: Build & Package DMG

# ─── Триггеры ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Кнопка "Run workflow" в GitHub → Actions
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например 1.0.1)'
        required: false
        default: '1.0.0'

# ─── Глобальные переменные ────────────────────────────────────────────────────
env:
  APP_NAME:    MouseActivitySimulator
  SCHEME:      MouseActivitySimulator
  VERSION:     ${{ github.event.inputs.version || '1.0.0' }}

jobs:
  build-dmg:
    name: Build DMG (macOS Sonoma)
    # GitHub предоставляет бесплатные macOS 14 (Sonoma) раннеры
    runs-on: macos-14

    steps:

    # ── 1. Checkout ─────────────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── 2. Выбрать Xcode 16 ─────────────────────────────────────────────────
    - name: Select Xcode 16
      run: |
        # macos-14 runner имеет несколько версий Xcode; берём последнюю 16.x
        XCODE=$(ls /Applications/ | grep "^Xcode_16" | sort -V | tail -1)
        if [[ -n "$XCODE" ]]; then
          sudo xcode-select -s "/Applications/$XCODE"
        fi
        echo "── Xcode version ──────────────────────────────"
        xcodebuild -version
        echo "── SDK list ───────────────────────────────────"
        xcodebuild -showsdks | grep macosx

    # ── 3. Сборка архива ────────────────────────────────────────────────────
    - name: xcodebuild archive
      run: |
        set -o pipefail
        xcodebuild archive \
          -project          "$APP_NAME.xcodeproj"                   \
          -scheme           "$SCHEME"                                \
          -configuration    Release                                  \
          -destination      "generic/platform=macOS"                 \
          -archivePath      "$RUNNER_TEMP/$APP_NAME.xcarchive"       \
          MACOSX_DEPLOYMENT_TARGET=14.0                             \
          ONLY_ACTIVE_ARCH=NO                                       \
          CODE_SIGN_IDENTITY="-"                                    \
          CODE_SIGNING_REQUIRED=YES                                 \
          CODE_SIGN_STYLE=Manual                                    \
          DEVELOPMENT_TEAM=""                                       \
          2>&1 | tee "$RUNNER_TEMP/build.log" \
               | grep -E "^(error:|warning:|Build succeeded|FAILED|Compiling|Linking)" \
               || true

        # Проверяем результат
        if [[ ! -d "$RUNNER_TEMP/$APP_NAME.xcarchive" ]]; then
          echo "─── Tail of build.log ───────────────────────────"
          tail -80 "$RUNNER_TEMP/build.log"
          exit 1
        fi
        echo "Archive OK: $RUNNER_TEMP/$APP_NAME.xcarchive"

    # ── 4. Сохранить build.log при ошибке ───────────────────────────────────
    - name: Upload build log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ${{ runner.temp }}/build.log

    # ── 5. Извлечь .app из архива ───────────────────────────────────────────
    - name: Extract .app
      run: |
        APP_IN_ARCHIVE=$(find "$RUNNER_TEMP/$APP_NAME.xcarchive/Products" \
                              -name "*.app" -maxdepth 4 | head -1)
        [[ -n "$APP_IN_ARCHIVE" ]] || { echo "ERROR: .app not found in archive"; exit 1; }

        mkdir -p "$RUNNER_TEMP/export"
        cp -R "$APP_IN_ARCHIVE" "$RUNNER_TEMP/export/$APP_NAME.app"
        echo "App: $RUNNER_TEMP/export/$APP_NAME.app"
        du -sh "$RUNNER_TEMP/export/$APP_NAME.app"

    # ── 6. Создание DMG ─────────────────────────────────────────────────────
    - name: Create DMG
      run: |
        STAGING="$RUNNER_TEMP/dmg_staging"
        TMP_DMG="$RUNNER_TEMP/tmp_rw.dmg"
        DMG_VOLUME="$APP_NAME $VERSION"
        DMG_FILE="$APP_NAME-$VERSION.dmg"

        # Staging: .app + ярлык на Applications
        mkdir -p "$STAGING"
        cp -R "$RUNNER_TEMP/export/$APP_NAME.app" "$STAGING/"
        ln -sf /Applications "$STAGING/Applications"

        # Размер с запасом 25 MB
        APP_KB=$(du -sk "$STAGING" | awk '{print $1}')
        DMG_MB=$(( APP_KB / 1024 + 25 ))

        # Создаём read-write образ
        hdiutil create \
          -srcfolder "$STAGING"   \
          -volname   "$DMG_VOLUME" \
          -fs        HFS+          \
          -fsargs    "-c c=64,a=16,b=16" \
          -format    UDRW          \
          -size      "${DMG_MB}m"  \
          "$TMP_DMG"

        # Монтируем и настраиваем окно Finder
        DEVICE=$(hdiutil attach -readwrite -noverify -noautoopen "$TMP_DMG" \
                 | awk '/^\/dev\/disk/ {print $1; exit}')
        MOUNT="/Volumes/$DMG_VOLUME"

        osascript - "$DMG_VOLUME" "$APP_NAME" <<'APPLESCRIPT'
on run {volumeName, appName}
  tell application "Finder"
    tell disk volumeName
      open
      set current view of container window to icon view
      set toolbar visible    of container window to false
      set statusbar visible  of container window to false
      set bounds             of container window to {200, 120, 760, 450}
      set theOpts to the icon view options of container window
      set arrangement of theOpts to not arranged
      set icon size   of theOpts to 128
      set position of item (appName & ".app") of container window to {160, 175}
      set position of item "Applications"     of container window to {400, 175}
      close
      open
      update without registering applications
      delay 2
      close
    end tell
  end tell
end run
APPLESCRIPT

        sync
        hdiutil detach "$DEVICE" -quiet

        # Конвертируем в сжатый read-only
        hdiutil convert "$TMP_DMG" \
          -format   UDZO            \
          -imagekey zlib-level=9    \
          -o        "$DMG_FILE"

        hdiutil verify "$DMG_FILE"
        echo "DMG_FILE=$DMG_FILE" >> "$GITHUB_ENV"
        du -sh "$DMG_FILE"

    # ── 7. Загрузить DMG как артефакт (скачать из Actions → Artifacts) ──────
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-${{ env.VERSION }}-macOS
        path: ${{ env.APP_NAME }}-${{ env.VERSION }}.dmg
        retention-days: 30

    # ── 8. Создать GitHub Release при пуше тега v* ──────────────────────────
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Mouse Activity Simulator ${{ env.VERSION }}
        body: |
          ## Mouse Activity Simulator ${{ env.VERSION }}

          ### Установка
          1. Скачать `MouseActivitySimulator-${{ env.VERSION }}.dmg`
          2. Открыть DMG, перетащить приложение в Applications
          3. Запустить → выдать разрешение **Accessibility**

          ### Горячие клавиши
          | Комбинация | Действие |
          |---|---|
          | ⌃⌥⌘S | Запустить |
          | ⌃⌥⌘X | Остановить |
          | ⌃⌥⌘P | Пауза/Продолжение |
          | ⌃⌥⌘R | Сброс статистики |
        files: ${{ env.APP_NAME }}-${{ env.VERSION }}.dmg
        draft: false
        prerelease: false
